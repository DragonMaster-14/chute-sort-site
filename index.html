<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChuteSort</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #f9f9f9;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 2.5rem; }
    .buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .btn-primary {
      background: #1a1a1a;
      color: #fff;
    }
    .btn-primary:hover { background: #333; }
    .btn-secondary {
      background: #fff;
      color: #1a1a1a;
      border: 1.5px solid #1a1a1a;
    }
    .btn-secondary:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ChuteSort</h1>
    <div class="buttons">
      <a href="policies/privacy-policy.html" class="btn btn-primary">Privacy Policy</a>
      <a href="policies/support.html" class="btn btn-secondary">Support</a>
    </div>
  </div>
</body>
</html>
